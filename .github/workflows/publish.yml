name: Publish to NuGet
on:
  push:
    branches:
    - 'main'

jobs:
  publish:
    name: "Pack and publish"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: "Setup Dotnet for use with actions"
      if: ${{ runner.environment == 'github-hosted' }}
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: 'global.json'

    - name: "Locate self-hosted dotnet"
      if: ${{ runner.environment != 'github-hosted' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail

        if command -v dotnet >/dev/null 2>&1; then
          echo "dotnet is already available on PATH"
          exit 0
        fi

        for candidate in \
          "$HOME/.dotnet" \
          "/home/runner/.dotnet" \
          "/home/runner2/.dotnet" \
          "/usr/share/dotnet" \
          "/usr/local/share/dotnet" \
          "/opt/dotnet"; do
          if [ -x "$candidate/dotnet" ]; then
            echo "Found dotnet at $candidate"
            export DOTNET_ROOT="$candidate"
            export PATH="$candidate:$PATH"
            echo "DOTNET_ROOT=$candidate" >> "$GITHUB_ENV"
            echo "$candidate" >> "$GITHUB_PATH"
            break
          fi
        done

        if ! command -v dotnet >/dev/null 2>&1; then
          echo "dotnet was not found in the expected installation locations." >&2
          exit 1
        fi

    - name: "Restore tools"
      run: dotnet tool restore

    - name: "Publish new version to NuGet"
      id: publish_nuget
      uses: alirezanet/publish-nuget@v3.1.0
      with:
        # Filepath of the project to be packaged, relative to root of repository
        PROJECT_FILE_PATH: commonItems/commonItems.csproj

        # NuGet package id, used for version detection & defaults to project name
        PACKAGE_NAME: PGCG.commonItems

        # Filepath with version info, relative to root of repository & defaults to PROJECT_FILE_PATH
        # VERSION_FILE_PATH: Directory.Build.props

        # Regex pattern to extract version info in a capturing group
        VERSION_REGEX: ^\s*<Version>(.*)<\/Version>\s*$

        # Useful with external providers like Nerdbank.GitVersioning, ignores VERSION_FILE_PATH & VERSION_REGEX
        # VERSION_STATIC: 1.0.0

        # Flag to toggle git tagging, enabled by default
        TAG_COMMIT: true

        # Format of the git tag, [*] gets replaced with actual version
        TAG_FORMAT: '*'

        # API key to authenticate with NuGet server
        NUGET_KEY: ${{secrets.NUGET_API_KEY}}

        # NuGet server uri hosting the packages, defaults to https://api.nuget.org
        # NUGET_SOURCE: https://api.nuget.org

        # Flag to toggle pushing symbols along with nuget package to the server, disabled by default
        # INCLUDE_SYMBOLS: false

        # Flag to toggle not building the project and letting pack command handle restoring & building, disabled by default
        NO_BUILD: true
