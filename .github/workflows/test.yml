name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test_and_check_coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: "Setup Dotnet for use with actions"
      if: ${{ runner.environment == 'github-hosted' }}
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: 'global.json'

    - name: "Locate self-hosted dotnet"
      if: ${{ runner.environment != 'github-hosted' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail

        if command -v dotnet >/dev/null 2>&1; then
          echo "dotnet is already available on PATH"
          exit 0
        fi

        for candidate in \
          "$HOME/.dotnet" \
          "/home/runner/.dotnet" \
          "/home/runner2/.dotnet" \
          "/usr/share/dotnet" \
          "/usr/local/share/dotnet" \
          "/opt/dotnet"; do
          if [ -x "$candidate/dotnet" ]; then
            echo "Found dotnet at $candidate"
            export DOTNET_ROOT="$candidate"
            export PATH="$candidate:$PATH"
            echo "DOTNET_ROOT=$candidate" >> "$GITHUB_ENV"
            echo "$candidate" >> "$GITHUB_PATH"
            break
          fi
        done

        if ! command -v dotnet >/dev/null 2>&1; then
          echo "dotnet was not found in the expected installation locations." >&2
          exit 1
        fi

    - name: "Restore tools"
      run: dotnet tool restore

    - name: "Restore projects"
      run: dotnet restore

    - name: "Run tests"
      working-directory: commonItems.UnitTests
      shell: pwsh
      run: |
       dotnet test --no-restore --coverlet --coverlet-output-format lcov --coverlet-exclude "[commonItems.UnitTests]*"

    - name: "Locate coverage report"
      id: coverage_report
      shell: pwsh
      run: |
        $coverageFile = Get-ChildItem "commonItems.UnitTests/bin/Debug/net10.0/TestResults/coverage*.info" |
          Sort-Object LastWriteTime -Descending |
          Select-Object -First 1 -ExpandProperty FullName

        if (-not $coverageFile) {
          throw "Coverage report not found."
        }

        "path=$coverageFile" >> $env:GITHUB_OUTPUT

    - name: "Publish coverage report to coveralls.io"
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: ${{ steps.coverage_report.outputs.path }}

  test:
    strategy:
      matrix:
        os: [[self-hosted, windows], macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: "Setup Dotnet for use with actions"
      if: ${{ runner.environment == 'github-hosted' }}
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: 'global.json'

    - name: "Locate self-hosted dotnet"
      if: ${{ runner.environment != 'github-hosted' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail

        if command -v dotnet >/dev/null 2>&1; then
          echo "dotnet is already available on PATH"
          exit 0
        fi

        for candidate in \
          "$HOME/.dotnet" \
          "/home/runner/.dotnet" \
          "/home/runner2/.dotnet" \
          "/usr/share/dotnet" \
          "/usr/local/share/dotnet" \
          "/opt/dotnet"; do
          if [ -x "$candidate/dotnet" ]; then
            echo "Found dotnet at $candidate"
            export DOTNET_ROOT="$candidate"
            export PATH="$candidate:$PATH"
            echo "DOTNET_ROOT=$candidate" >> "$GITHUB_ENV"
            echo "$candidate" >> "$GITHUB_PATH"
            break
          fi
        done

        if ! command -v dotnet >/dev/null 2>&1; then
          echo "dotnet was not found in the expected installation locations." >&2
          exit 1
        fi

    - name: "Restore tools"
      run: dotnet tool restore

    - name: "Run tests"
      working-directory: commonItems.UnitTests
      run: dotnet test
