name: Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os: [[self-hosted, linux], [self-hosted, windows], macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: "Setup Dotnet for use with actions"
      if: ${{ runner.environment == 'github-hosted' }}
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: 'global.json'

    - name: "Locate self-hosted dotnet"
      if: ${{ runner.environment != 'github-hosted' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail

        if command -v dotnet >/dev/null 2>&1; then
          echo "dotnet is already available on PATH"
          exit 0
        fi

        for candidate in \
          "$HOME/.dotnet" \
          "/home/runner/.dotnet" \
          "/home/runner2/.dotnet" \
          "/usr/share/dotnet" \
          "/usr/local/share/dotnet" \
          "/opt/dotnet"; do
          if [ -x "$candidate/dotnet" ]; then
            echo "Found dotnet at $candidate"
            export DOTNET_ROOT="$candidate"
            export PATH="$candidate:$PATH"
            echo "DOTNET_ROOT=$candidate" >> "$GITHUB_ENV"
            echo "$candidate" >> "$GITHUB_PATH"
            break
          fi
        done

        if ! command -v dotnet >/dev/null 2>&1; then
          echo "dotnet was not found in the expected installation locations." >&2
          exit 1
        fi

    - name: "Build project"
      run: |
       dotnet tool restore
       dotnet build commonItems/commonItems.csproj /m /p:Configuration=Debug